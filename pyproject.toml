[project]
name = "brain"
version = "0.1.0"
description = "个人知识管家（第二大脑）— AI 驱动的本地知识管理系统"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
authors = [
    {name = "kchen"}
]
dependencies = [
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.3.0",
    "psycopg[binary]>=3.2.0",
    "langgraph-checkpoint-postgres>=3.0.0",
    "sentence-transformers>=3.0.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "trafilatura>=1.12.0",  # RSS 条目正文抓取
    "watchdog>=4.0.0",
    "markdown>=3.5.0",
    "loguru>=0.7.0",
    "tiktoken>=0.7.0",
]

[project.scripts]
brain = "brain.cli.main:main"

[tool.setuptools.packages.find]
include = ["brain*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "UP042",  # (str, Enum) 是刻意为之——保证 JSON/数据库序列化行为稳定
    "B008",   # FastAPI 的 File/Query 依赖注入是标准模式
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
